# Offline candidate verification. Installs nothing at runtime beyond the
# public runner image, uploads no package artifact, and performs no provider,
# marketplace, release, publication, or live-skill step.

stages:
  - verify

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

offline-gates:
  stage: verify
  image: python:3.12
  rules:
    - when: on_success
  script:
    - python3 -B tools/validate_contract.py
    - python3 -B tools/build_adapters.py --mode normal --output-root artifacts/build-normal
    - python3 -B tools/build_adapters.py --mode candidate-sandbox --output-root artifacts/build
    - python3 -B tools/validate_packages.py
    - python3 -B tools/verify_determinism.py
    - python3 -B tools/validate_runtime_fixtures.py
    - python3 -B tools/run_evals.py
    - python3 -B tools/test_external_workspace.py
    - python3 -B tools/cli.py init-skill --workspace "/tmp/rigwright-${CI_JOB_ID}" --id changelog-check --description "Check a changelog for one required release heading." --outcome "Report whether the required heading exists."
    - python3 -B tools/cli.py validate-workspace --workspace "/tmp/rigwright-${CI_JOB_ID}"
  timeout: 20m

# Native surface validators need a runner that already provides the Claude
# plugin CLI and the Codex plugin validator. This job is manual and only
# schedulable where such a runner is registered; it never blocks the pipeline.
native-validators:
  stage: verify
  tags:
    - rigwright-offline
  rules:
    - when: manual
      allow_failure: true
  variables:
    RIGWRIGHT_CLAUDE_CLI: "claude"
    RIGWRIGHT_CODEX_PLUGIN_VALIDATOR: ""
  script:
    - python3 -B tools/build_adapters.py --mode candidate-sandbox --output-root artifacts/build
    - test -n "$RIGWRIGHT_CLAUDE_CLI"
    - command -v "$RIGWRIGHT_CLAUDE_CLI"
    - '"$RIGWRIGHT_CLAUDE_CLI" plugin validate artifacts/build/claude-code/rigwright'
    - test -n "$RIGWRIGHT_CODEX_PLUGIN_VALIDATOR"
    - test -f "$RIGWRIGHT_CODEX_PLUGIN_VALIDATOR"
    - python3 -B "$RIGWRIGHT_CODEX_PLUGIN_VALIDATOR" artifacts/build/codex/rigwright
  timeout: 20m
